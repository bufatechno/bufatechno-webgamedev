<!DOCTYPE html>

<head>

  <!--

       See SKILL.md Anti-Slop Protocol + references/design-system.md

  <title>Babylon.js Game — Starter (replace with game title)</title>
  <style>
    :root{
      --bg:#0a0e13; --panel:rgba(16,22,30,0.72); --text:#e6edf3; --muted:#9aa8b3;
      --accent:#55ccff; --accent-2:#ffd166; --radius:14px;
      --font-display:"Space Grotesk", system-ui, sans-serif; --font-body:"Inter", system-ui, sans-serif;
    }
    *{box-sizing:border-box}
    html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:var(--font-body); }
    #renderCanvas{ width:100%; height:100%; touch-action:none; outline:none; display:block }
    #hud{ position:fixed; inset:0; pointer-events:none }
    #hud-topbar{
      position:absolute; top:14px; left:14px; right:14px; display:flex; gap:10px; justify-content:space-between;
      font-size:13px;
    }
    .hud-card{
      background:var(--panel); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,.08);
      border-radius:var(--radius); padding:10px 12px; min-width:140px;
    }
    .hud-card b{ font-family:var(--font-display); letter-spacing:.08em; font-size:11px; color:var(--muted); display:block; margin-bottom:4px }
    #overlay{
      position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
      background: radial-gradient(900px 500px at 60% 0%, rgba(255,209,102,.14), transparent 60%),
                  linear-gradient(180deg, rgba(0,0,0,.55), rgba(0,0,0,.88));
      color:var(--text); cursor:pointer; z-index:10; text-align:center; padding:24px;
    }
    #overlay h1{
      margin:0 0 8px; font-family:var(--font-display); font-size:clamp(28px, 5vw, 52px);
      letter-spacing:.1em; text-transform:uppercase;
      text-shadow:0 8px 30px rgba(255,209,102,.22);
    }
    #overlay h1 span{ color:var(--accent-2) }
    #overlay .subtitle{ color:var(--muted); font-size:12px; letter-spacing:.18em; text-transform:uppercase; margin-bottom:16px }
    #overlay .cta{
      margin-top:16px; padding:12px 22px; border-radius:999px;
      border:1px solid var(--accent-2); color:var(--accent-2); background:rgba(255,209,102,.08);
      font-family:var(--font-display); letter-spacing:.14em; font-size:12px; text-transform:uppercase;
    }
  </style>
  <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
  <link rel="manifest" href="./public/manifest.json" />
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <div id="hud">
    <div id="hud-topbar">
      <div class="hud-card"><b>STATUS</b> <span id="health">—</span> · <span id="score">—</span></div>
      <div class="hud-card" style="text-align:right"><b>PERF</b> <span id="fps">—</span> fps</div>
    </div>
  </div>
  <div id="overlay" role="button" tabindex="0" aria-label="Start game">
    <div class="subtitle">Bufatechno Starter — Replace Title & Theme Per Genre</div>
    <h1>GAME <span>TITLE</span></h1>
    <div class="cta">Click to Play — (AI must replace with themed version)</div>
    <div style="margin-top:10px;color:var(--muted);font-size:11px">Starter — Final MUST be themed HUD/overlay per design-system.md</div>
  </div>
  <script type="importmap">
  {
    "imports": {
      "@babylonjs/core": "https://cdn.jsdelivr.net/npm/@babylonjs/core@8.15.0/+esm",
      "@babylonjs/gui": "https://cdn.jsdelivr.net/npm/@babylonjs/gui@8.15.0/+esm",
      "@babylonjs/loaders": "https://cdn.jsdelivr.net/npm/@babylonjs/loaders@8.15.0/+esm",
      "@babylonjs/materials": "https://cdn.jsdelivr.net/npm/@babylonjs/materials@8.15.0/+esm",
      "@babylonjs/havok": "https://cdn.jsdelivr.net/npm/@babylonjs/havok@1.3.9/+esm"
    }
  }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
